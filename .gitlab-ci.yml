# Managed by lilim — `lilim sync` rewrites this from lilim.toml ([ci] section).
stages: [build, check, package, release, deploy]

variables:
  GIT_DEPTH: "1"
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

.deps-unix: &deps-unix
  - python3 -m pip install --break-system-packages conan ninja 2>/dev/null || python3 -m pip install conan ninja

.build: &build
  - cmake --preset release
  - cmake --build --preset release

.cache: &cache
  key: "$CI_JOB_NAME"
  paths: [.conan2/p]

linux-gcc:
  stage: build
  image: gcc:14
  cache: *cache
  variables: { CC: gcc, CXX: g++ }
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake python3-pip git curl zip unzip tar pkg-config > /dev/null
    - *deps-unix
  script: *build

linux-clang:
  stage: build
  image: ubuntu:24.04
  cache: *cache
  variables: { CC: clang-18, CXX: clang++-18 }
  before_script:
    - apt-get update -qq && apt-get install -y -qq clang-18 libstdc++-14-dev cmake python3-pip git curl zip unzip tar pkg-config > /dev/null
    - *deps-unix
  script: *build

windows-msvc:
  stage: build
  tags: [saas-windows-medium-amd64]
  cache: *cache
  before_script:
    - $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
    - Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
    - Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
    - python -m pip install conan ninja
  script:
    - cmake --preset release
    - cmake --build --preset release

format:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq clang-format git > /dev/null
  script:
    - git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | xargs clang-format --dry-run --Werror
