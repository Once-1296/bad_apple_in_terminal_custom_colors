# Managed by lilim — `lilim sync` rewrites this from lilim.toml ([ci] section).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { name: linux-clang, os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-latest, cc: cl, cxx: cl }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Conan and Ninja
        run: pip install conan ninja
      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.name }}-

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | xargs clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4
      - run: pip install conan ninja
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/debug -quiet "$(pwd)/(src|include|libs|apps|tests)/"
